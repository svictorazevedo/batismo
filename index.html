<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Batismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#1b2333; --muted:#6b7487; --line:#e4e8f0;
    --ok:#1f9d63; --ok-bg:#e5f6ee; --warn:#d9822b; --warn-bg:#fdf0e3;
    --brand:#2563eb; --brand-2:#0ea5e9;
    --juvenis:#8b5cf6; --adolescentes:#ec4899; --jovens:#0ea5e9; --adultos:#f59e0b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f141d; --card:#171e2b; --text:#e8ecf3; --muted:#97a1b4; --line:#263044;
      --ok-bg:#12352a; --warn-bg:#3a2a16; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;padding:36px 16px 72px;text-align:center}
  header h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.5px}
  header p{margin:6px 0 0;opacity:.9}
  header .upd{font-size:13px;opacity:.8;margin-top:10px}
  main{max-width:1100px;margin:-48px auto 40px;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(20,30,60,.06)}
  .resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .kpi{padding:20px}
  .kpi .lbl{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .kpi .num{font-size:40px;font-weight:800;margin-top:4px}
  .kpi.ok .num{color:var(--ok)} .kpi.warn .num{color:var(--warn)}
  .kpi .sub{font-size:13px;color:var(--muted)}
  .redes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .rede{padding:18px;border-top:5px solid var(--c);cursor:pointer;transition:transform .15s}
  .rede:hover{transform:translateY(-2px)}
  .rede.sel{outline:2px solid var(--c)}
  .rede h3{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
  .rede h3 span{font-size:26px;font-weight:800;color:var(--c)}
  .linha{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
  .linha b.ok{color:var(--ok)} .linha b.warn{color:var(--warn)}
  .bar{height:8px;border-radius:99px;background:var(--warn-bg);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .pct{font-size:12px;color:var(--muted);margin-top:4px}
  .lista{padding:18px}
  .ferr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .ferr input{flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .grupo{margin-top:18px}
  .grupo-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .grupo h4{margin:0;padding-left:10px;border-left:4px solid var(--c);font-size:16px}
  .btn-exp{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-exp:hover{border-color:var(--brand);color:var(--brand)}
  .btn-exp:disabled{opacity:.4;cursor:default}
  .btn-exp.forte{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn-exp.forte:hover{color:#fff;filter:brightness(1.1)}
  .grupo h4 small{color:var(--muted);font-weight:500}
  ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
  li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bg);font-size:15px}
  li .n{color:var(--muted);font-size:12px;min-width:22px}
  li .tag{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
  li.inc{border:1px dashed var(--warn)}
  .vazio{color:var(--muted);font-size:14px;padding:8px 2px}
  li .nm{display:flex;flex-direction:column;line-height:1.25}
  li .ld{font-size:12px;color:var(--muted)}
  li.inc{background:var(--warn-bg)}
  li.inc .nm>span:first-child{color:var(--warn);font-weight:700}
  .clic{cursor:pointer;text-decoration:underline dotted 2px;text-underline-offset:4px}
  .clic:hover{opacity:.75}
  .kpi .hint{font-size:11px;color:var(--muted);margin-top:6px}
  .modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:10;overflow-y:auto}
  .modal.on{display:flex}
  .modal .box{width:100%;max-width:720px;padding:22px}
  .modal .mt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
  .modal h2{margin:0;font-size:20px}
  .modal .fechar{border:0;background:var(--bg);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
  .modal table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  .modal th,.modal td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  .modal th{font-size:12px;color:var(--muted);text-transform:uppercase}
  .modal td.inc{color:var(--warn);font-weight:700}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 30px}
  @media (max-width:900px){.redes{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.resumo{grid-template-columns:1fr}.redes{grid-template-columns:1fr}.kpi .num{font-size:32px}}
  @media print{header{padding:16px;color:#000;background:none}main{margin-top:0}.ferr{display:none}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
  <h1 id="titulo">Batismo</h1>
  <p id="subtitulo"></p>
  <div class="upd" id="upd"></div>
</header>
<main>
  <section class="resumo">
    <div class="card kpi"><div class="lbl">Total de batizandos</div><div class="num clic" id="kTotal" data-m="todos">0</div><div class="sub">em todas as redes</div></div>
    <div class="card kpi ok"><div class="lbl">Nome completo</div><div class="num clic" id="kOk" data-m="completo">0</div><div class="sub" id="kOkP"></div></div>
    <div class="card kpi warn"><div class="lbl">Nome incompleto</div><div class="num clic" id="kInc" data-m="incompleto">0</div><div class="sub" id="kIncP"></div><div class="hint">Clique no número para ver nomes e líderes</div></div>
  </section>
  <section class="redes" id="redes"></section>
  <section class="card lista">
    <div class="ferr">
      <input id="busca" type="search" placeholder="Buscar nome...">
      <div class="chips" id="filtro">
        <button class="chip on" data-f="todos">Todos</button>
        <button class="chip" data-f="completo">Completos</button>
        <button class="chip" data-f="incompleto">Incompletos</button>
      </div>
      <button class="btn-exp forte" id="expTodas">⬇ Exportar todas as redes</button>
    </div>
    <div id="grupos"></div>
  </section>
</main>
<div class="modal" id="modal"><div class="card box">
  <div class="mt"><h2 id="mTit"></h2><button class="fechar" id="mFechar" aria-label="Fechar">×</button></div>
  <div id="mCorpo"></div>
</div></div>
<footer>Clique nos números para ver a lista com os líderes · Clique em uma rede para filtrar · Nomes marcados como <b>incompleto</b> precisam do sobrenome</footer>
<script src="dados.js"></script>
<script>
const CORES = {Juvenis:"var(--juvenis)", Adolescentes:"var(--adolescentes)", Jovens:"var(--jovens)", Adultos:"var(--adultos)"};
const CONECT = new Set(["de","da","do","das","dos","e","d"]);
const limpa = s => String(s).trim().replace(/\s+/g, " ");
const completo = n => limpa(n).split(" ").filter(p => p.length > 1 && !CONECT.has(p.toLowerCase())).length >= 2;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const $ = id => document.getElementById(id);

const D = BATISMO;
$("titulo").textContent = D.titulo || "Batismo";
$("subtitulo").textContent = D.subtitulo || "";
if (D.atualizadoEm) $("upd").textContent = "Atualizado em " + D.atualizadoEm;

const redes = Object.entries(D.redes).map(([nome, lista]) => {
  const pessoas = lista.map(p => typeof p === "string" ? {nome: p} : p)
    .map(p => ({n: limpa(p.nome || ""), l: limpa(p.lider || ""), inc: !!p.incompleto}))
    .filter(p => p.n).map(p => ({n: p.n, l: p.l, ok: !p.inc && completo(p.n)}));
  const ok = pessoas.filter(p => p.ok).length;
  return {nome, pessoas, total: pessoas.length, ok, inc: pessoas.length - ok};
});
const T = redes.reduce((a, r) => a + r.total, 0), OK = redes.reduce((a, r) => a + r.ok, 0);
$("kTotal").textContent = T; $("kOk").textContent = OK; $("kInc").textContent = T - OK;
$("kOkP").textContent = pct(OK, T) + "% do total"; $("kIncP").textContent = pct(T - OK, T) + "% do total";

let redeSel = null, filtro = "todos";
function cards() {
  $("redes").innerHTML = redes.map(r => `
    <div class="card rede ${redeSel === r.nome ? "sel" : ""}" style="--c:${CORES[r.nome] || "var(--brand)"}" data-r="${r.nome}">
      <h3>${r.nome}<span class="clic" data-m="todos" data-mr="${r.nome}">${r.total}</span></h3>
      <div class="linha">Completos <b class="ok clic" data-m="completo" data-mr="${r.nome}">${r.ok}</b></div>
      <div class="linha">Incompletos <b class="warn clic" data-m="incompleto" data-mr="${r.nome}">${r.inc}</b></div>
      <div class="bar"><i style="width:${pct(r.ok, r.total)}%"></i></div>
      <div class="pct">${pct(r.ok, r.total)}% com nome completo</div>
    </div>`).join("");
}
function lista() {
  const q = norm($("busca").value.trim());
  $("grupos").innerHTML = redes.filter(r => !redeSel || r.nome === redeSel).map(r => {
    const ps = r.pessoas.map((p, i) => ({...p, i: i + 1})).filter(p =>
      (filtro === "todos" || (filtro === "completo") === p.ok) && (!q || norm(p.n + " " + p.l).includes(q)));
    const itens = ps.map(p => `<li class="${p.ok ? "" : "inc"}"><span class="n">${p.i}</span><span class="nm"><span>${esc(p.n)}</span><span class="ld">Líder: ${esc(p.l || "não informado")}</span></span>${p.ok ? "" : '<span class="tag">incompleto</span>'}</li>`).join("");
    return `<div class="grupo" style="--c:${CORES[r.nome] || "var(--brand)"}">
      <div class="grupo-top">
        <h4>${r.nome} <small>(${ps.length})</small></h4>
        <button class="btn-exp" data-exp="${r.nome}" ${r.total ? "" : "disabled"}>⬇ Exportar ${r.nome}</button>
      </div>
      ${ps.length ? `<ol>${itens}</ol>` : `<div class="vazio">${r.total ? "Nenhum nome encontrado." : "Nenhum nome cadastrado ainda."}</div>`}
    </div>`;
  }).join("");
}
// Janela com a lista (nome + líder) ao clicar num número
const TIT = {todos: "Todos os batizandos", completo: "Nomes completos", incompleto: "Nomes incompletos"};
function abrirModal(tipo, rede) {
  const sel = redes.filter(r => !rede || r.nome === rede);
  $("mTit").textContent = TIT[tipo] + (rede ? " · " + rede : "");
  $("mCorpo").innerHTML = sel.map(r => {
    const ps = r.pessoas.filter(p => tipo === "todos" || (tipo === "completo") === p.ok);
    return `<div class="grupo" style="--c:${CORES[r.nome] || "var(--brand)"}">
      <h4>${r.nome} <small>(${ps.length})</small></h4>
      ${ps.length ? `<table><tr><th>#</th><th>Nome</th><th>Líder</th></tr>${ps.map((p, i) =>
        `<tr><td>${i + 1}</td><td class="${p.ok ? "" : "inc"}">${esc(p.n)}</td><td>${esc(p.l || "não informado")}</td></tr>`).join("")}</table>`
        : `<div class="vazio">Nenhum nome.</div>`}
    </div>`;
  }).join("");
  $("modal").classList.add("on");
}
document.addEventListener("click", e => {
  const n = e.target.closest("[data-m]"); if (!n) return;
  e.stopPropagation(); abrirModal(n.dataset.m, n.dataset.mr);
}, true);
$("mFechar").onclick = () => $("modal").classList.remove("on");
$("modal").onclick = e => { if (e.target.id === "modal") $("modal").classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("modal").classList.remove("on"); });

$("redes").onclick = e => {
  const c = e.target.closest(".rede"); if (!c) return;
  redeSel = redeSel === c.dataset.r ? null : c.dataset.r; cards(); lista();
};
$("filtro").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return; filtro = b.dataset.f;
  $("filtro").querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); lista();
};
$("busca").oninput = lista;

// Exporta CSV (abre direto no Excel: separador ";" e UTF-8 com BOM)
function exportar(lista, arquivo) {
  const cel = v => `"${String(v).replace(/"/g, '""')}"`;
  const linhas = [["Nº", "Nome", "Líder", "Rede", "Situação"].map(cel).join(";")];
  lista.forEach(r => r.pessoas.forEach((p, i) =>
    linhas.push([i + 1, p.n, p.l, r.nome, p.ok ? "Completo" : "Incompleto"].map(cel).join(";"))));
  const blob = new Blob(["﻿" + linhas.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = arquivo + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("grupos").onclick = e => {
  const b = e.target.closest("[data-exp]"); if (!b) return;
  exportar(redes.filter(r => r.nome === b.dataset.exp), "batismo-" + b.dataset.exp.toLowerCase());
};
$("expTodas").onclick = () => exportar(redes, "batismo-todas-as-redes");
cards(); lista();
</script>
</body>
</html>
